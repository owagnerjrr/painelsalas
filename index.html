<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Salas</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#0d2e50;font-family:Segoe UI,Arial,sans-serif}header{height:134px;background:#07345d;color:#fff;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:20px 32px}h1{font-size:40px;margin:0}header p{margin:5px 0;opacity:.75;font-size:20px}.legend{text-align:center}.clock{text-align:right}.clock b{font-size:48px;display:block}.grid{padding:15px 18px;display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.room{background:white;border:1px solid #d8e2eb;border-radius:13px;padding:13px;min-height:310px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:5px;border-bottom:1px solid #e2e8f0;padding-bottom:10px}.name{font-size:24px;font-weight:800}.badge{border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.busy{background:#fde7ea;color:#9c2636}.free{background:#e4f6ec;color:#147b46}.next{background:#fff1c9;color:#86650c}.maint{background:#e9edf2;color:#53606e}.label{font-size:12px;font-weight:800;color:#57708a;margin-top:13px}.now{font-size:20px;font-weight:900;margin-top:4px}.desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.slot{margin-top:7px;padding:7px;border-radius:6px;background:#e8f5ee;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot.occ{background:#f9e7e9;color:#7d2531;font-weight:700}.voice{position:fixed;right:18px;bottom:18px;border:0;border-radius:30px;background:#07549a;color:white;font-size:20px;font-weight:800;padding:17px 24px;cursor:pointer}.voice-back{position:fixed;inset:0;background:#07192bbd;display:flex;align-items:center;justify-content:center;z-index:20}.voice-box{width:min(700px,92vw);background:#fff;border-radius:20px;padding:30px;text-align:center}.voice-icon{font-size:50px}.voice-transcript{background:#f0f4f8;padding:13px;border-radius:10px;text-align:left}.voice-cancel{padding:12px 18px;border:0;border-radius:10px;font-weight:800}.detail{position:fixed;display:none;background:#102f50;color:#fff;padding:12px;border-radius:10px;z-index:10;max-width:330px;box-shadow:0 10px 30px #0004;font-size:13px;pointer-events:none}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div><h1>Painel de Salas</h1><p>Senac Três Corações</p></div><div class="legend">🟢 Livre &nbsp;&nbsp; 🔴 Em uso &nbsp;&nbsp; 🟡 Próxima utilização &nbsp;&nbsp; ⚫ Manutenção</div><div class="clock"><b id="clock"></b><span id="date"></span><small style="display:block;margin-top:7px">● Atualização automática</small></div></header><main class="grid" id="cards"></main><div id="voiceRoot"></div><div class="detail" id="detail"></div><script>
const BR_ZONE='America/Sao_Paulo';
function brParts(now=new Date()){
 const p=new Intl.DateTimeFormat('en-CA',{timeZone:BR_ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);
 const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
 return {date:v.year+'-'+v.month+'-'+v.day,time:v.hour+':'+v.minute};
}
function pastStart(date,time){const n=brParts();return date<n.date||(date===n.date&&time<=n.time)}
function cleanupExpired(){
 const n=brParts();let changed=false;
 for(const room of Object.keys(data)){
  const kept=(data[room]||[]).filter(b=>{const date=b.date||n.date;return date>n.date||(date===n.date&&b.end>n.time)});
  if(kept.length!==(data[room]||[]).length)changed=true;
  for(const b of kept){if(!b.date){b.date=n.date;changed=true}}
  data[room]=kept;
 }
 if(changed){/* limpeza visual */}
}
function voiceDate(s){
 const today=brParts().date;let d=new Date(today+'T12:00:00Z');
 d.setUTCDate(d.getUTCDate()+(/depois de amanha/.test(s)?2:/amanha/.test(s)?1:0));
 const m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
 if(m){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):+today.slice(0,4);d=new Date(Date.UTC(y,+m[2]-1,+m[1],12))}
 return d.toISOString().slice(0,10);
}

const rooms=['1','2','3 - ENFERMAGEM','4 - AUDITÓRIO','101 - LAB. DE ESTÉTICA','102','201','202 - LAB. DE INFORMÁTICA','203 / MAKER','204 - LAB. DE INFORMÁTICA','205 / INOVAÇÃO','206','207','208'];
const OPEN_TIME='08:00', CLOSE_TIME='22:00';
const defaultPeople=['Alba Valeria Mendes Da Silva','Ana Claudia Novais Luiz','Anderson Oliveira Silva','Andrea Francisca Tavares Olavo','Andressa Goncalves Cavalcanti Campos','Bianca Pereira Viana','Clara de Mesquita','Dailton de Paula Costa','Delanny Petrin Pinho Faustino','Diogo Branquinho Auad','Fabiola De Souza Leandro','Felipe Henrique Pereira Tomaz','Fernanda Aparecida Costa','Germey Jose da Silva','Hugo Oliveira De Faria','Jessica Aparecida Costa','Jose Luiz Figueiredo Galvao','Kaira Pereira Dos Santos','Kelly Andries Monte Goncalves','Luane Flavia Dias Silva','Lucas da Silva Oliveira','Luccas Rafael Teixeira','Ludimila Renata Fonseca Francisco','Maisa Santos Fernandes','Marccelo Henrique de Souza Abdala Hess','Mateus Oliveira Scalenghi','Mayara Borges De Carvalho','Mayara Roberta Carvalho dos Santos','Natalia Borges Messias','Natalia Paula Dos Santos Cruz','Patricia Melo Santos Miranda','Pedro Augusto Santos Silva de Deus','Pedro Lucas Costa Ribeiro','Renata Pires De Souza Nascimento','Ricardo Lucio Martin','Rodolfo Perigolo Menezes','Rodrigo Pereira Castilho','Rozelena Cardoso','Sheila Roberta Pereira','Silvana Aparecida Alves','Suzana Santos Ribeiro','Tatiane Cristina Caetano Cardoso','Tereza De Jesus Pires','Thayane Emmily Tiburcio da Silva Palmeira','Thierry da Silva Benedito','Veronica De Oliveira Lopes','Wagner Pereira Rosario Junior','Yasmin Mayara de Carvalho Fonseca'];
const seed={'1':[{teacher:'Carlos',course:'Técnico em Administração',start:'14:00',end:'17:00'}],'2':[{teacher:'Ana Paula',course:'Excel Avançado',start:'13:00',end:'17:00'}],'3 - ENFERMAGEM':[{teacher:'Juliana',course:'Assistência de Enfermagem',start:'15:00',end:'18:00'}],'4 - AUDITÓRIO':[{teacher:'Supervisão',course:'Reunião Pedagógica',start:'18:00',end:'20:00'}],'101 - LAB. DE ESTÉTICA':[{teacher:'Mônica',course:'Massagem Relaxante',start:'13:00',end:'16:00'}],'102':[{teacher:'Lucas',course:'Canva para Negócios',start:'14:00',end:'17:00'}],'201':[{teacher:'Roberto',course:'Técnico em Administração',start:'13:00',end:'17:00'}],'202 - LAB. DE INFORMÁTICA':[{teacher:'Wagner',course:'Técnico em Informática',start:'13:00',end:'17:00'}],'203 / MAKER':[{teacher:'Felipe',course:'Impressão 3D',start:'15:30',end:'17:30'}],'204 - LAB. DE INFORMÁTICA':[{teacher:'Carlos',course:'Excel Avançado',start:'14:30',end:'17:30'}],'205 / INOVAÇÃO':[{teacher:'Mariana',course:'Inovação e Tecnologia',start:'16:00',end:'18:00'}],'206':[],'207':[{teacher:'Rodrigo',course:'Desenvolvimento de Sistemas',start:'14:00',end:'17:00'}],'208':[{teacher:'Fernanda',course:'Gestão Administrativa',start:'15:00',end:'18:00'}]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isoToday=()=>brParts().date;const mins=t=>{let[h,m]=t.split(':').map(Number);return h*60+m};const roomName=r=>/^\d+$/.test(r)?'Sala '+r:r;let data={};let maintenance={};function saveAll(){}function renderAgenda(){cleanupExpired();let n=new Date(),m=mins(brParts().time),day=isoToday();document.getElementById('clock').textContent=n.toLocaleTimeString('pt-BR',{timeZone:BR_ZONE,hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=n.toLocaleDateString('pt-BR',{timeZone:BR_ZONE,weekday:'long',day:'2-digit',month:'long',year:'numeric'});document.getElementById('cards').innerHTML=rooms.map(r=>{let a=(data[r]||[]).filter(x=>(x.date||day)===day).sort((x,y)=>x.start.localeCompare(y.start));let cur=a.find(x=>m>=mins(x.start)&&m<mins(x.end)),next=a.find(x=>m<mins(x.start));let cls=maintenance[r]?'maint':cur?'busy':next?'next':'free',lab=maintenance[r]?'MANUTENÇÃO':cur?'EM USO':next?'PRÓXIMA':'LIVRE';let outside=m<mins(OPEN_TIME)||m>=mins(CLOSE_TIME);let headline=maintenance[r]?'Em manutenção':outside?`Funcionamento ${OPEN_TIME}–${CLOSE_TIME}`:cur?`${cur.start}–${cur.end} · EM USO`:next?`Livre agora · até ${next.start}`:`Livre agora · até ${CLOSE_TIME}`;return `<section class="room"><div class="top"><div class="name">${esc(roomName(r))}</div><span class="badge ${cls}">● ${lab}</span></div><div class="label">SITUAÇÃO AGORA</div><div class="now">${headline}</div><div class="desc">${cur?esc(cur.course+' · '+cur.teacher):next?esc(next.course+' · '+next.teacher):''}</div><div class="label">RESTANTE DO DIA</div>${a.length?a.map(b=>`<div class="slot ${m>=mins(b.start)&&m<mins(b.end)?'occ':''}" data-info="${esc(roomName(r))}|${day}|${b.start}|${b.end}|${esc(b.teacher)}|${esc(b.course)}">${b.start}–${b.end} &nbsp; ${esc(b.course)}</div>`).join(''):'<div class="slot">Livre</div>'}</section>`}).join('');bindDetails()}
function bindDetails(){const d=document.getElementById('detail');document.querySelectorAll('.slot[data-info]').forEach(el=>{el.onmouseenter=e=>{let [r,dt,s,en,t,c]=el.dataset.info.split('|');d.innerHTML=`<b>${r}</b><br>📅 ${dt.split('-').reverse().join('/')}<br>🕐 ${s} às ${en}<br>👤 ${t}<br>🎓 ${c}`;d.style.display='block'};el.onmousemove=e=>{d.style.left=Math.min(innerWidth-350,e.clientX+15)+'px';d.style.top=(e.clientY+15)+'px'};el.onmouseleave=()=>d.style.display='none'})}renderAgenda();setInterval(renderAgenda,1000);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[,.;]/g,' ').replace(/\s+/g,' ').trim();const nums={uma:1,um:1,duas:2,dois:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20};function parseDate(s){return voiceDate(s)}function times(s){s=s.replace(/dar uma/g,'da uma');let a=[...s.matchAll(/\b(\d{1,2})(?::(\d{2}))?\b/g)].map(m=>({h:+m[1],m:+(m[2]||0),i:m.index})).filter(x=>x.h<=23&&x.m<60);if(a.length>=2)return a.slice(0,2).map((x,i)=>{let h=x.h,q=s.slice(Math.max(0,x.i-15),x.i+25);if(h<12&&/tarde|noite/.test(q))h+=12;else if(i===0&&h<=7&&a[1].h>h)h+=12;else if(i===1&&h<=7&&a[0].h>=8)h+=12;return `${String(h).padStart(2,'0')}:${String(x.m).padStart(2,'0')}`});let w=[...s.matchAll(/\b(uma|um|duas|dois|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte)\b/g)];if(w.length>=2)return w.slice(0,2).map((x,i)=>{let h=nums[x[1]];if(h<12&&(i===0&&nums[w[1][1]]>h||/tarde|noite/.test(s.slice(x.index,x.index+30))))h+=12;if(i===1&&h<12&&nums[w[0][1]]>=8)h+=12;return String(h).padStart(2,'0')+':00'});return []}function roomOf(s){for(const r of rooms){let n=r.match(/^\d+/)[0];if(new RegExp('(?:sala|lab|na|no)?\\s*'+n+'\\b').test(s))return r}return null}function personOf(s){for(const p of defaultPeople){if(norm(p).split(' ').filter(x=>x.length>2).some(x=>new RegExp('\\b'+x+'\\b').test(s)))return p}return null}function courseOf(s,p){let x=s.replace(/\b(agendar|agenda|marcar|marca|reservar|reserva|bota|coloca|hoje|amanha|sala|nome|professor|prof|curso|turma|das|da|de|ate|as|na|no|pra|pro)\b/g,' ').replace(/\b\d{1,4}(?::\d{2})?\b/g,' ');if(p)norm(p).split(' ').forEach(w=>{if(w.length>2)x=x.replace(new RegExp('\\b'+w+'\\b','g'),' ')});x=x.replace(/\b(uma|um|duas|dois|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|tarde|noite|manha|horas?)\b/g,' ').replace(/\s+/g,' ').trim();return x?x.replace(/\binfo\b/,'Informática'):null}function voiceShow(msg,t=''){document.getElementById('voiceRoot').innerHTML=`<div class="voice-back"><div class="voice-box"><div class="voice-icon">🎙️</div><h2>Agendar por voz</h2><p>${msg}</p>${t?`<div class="voice-transcript"><b>Você disse:</b> “${esc(t)}”</div>`:''}<button class="voice-cancel">Fechar</button></div></div>`;document.querySelector('.voice-cancel').onclick=()=>voiceRoot.innerHTML=''}function handleVoice(t){voiceShow('Agendamentos são feitos somente pela Administração.',t)}
let stateVersion=-1;
async function syncState(){
 try{
  const r=await fetch('/api/state',{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
  const s=await r.json();
  if((s.version??0)!==stateVersion){stateVersion=s.version??0;data=s.data||{};maintenance=s.maintenance||{};renderAgenda()}
 }catch(e){console.warn('Falha ao sincronizar painel:',e)}
}
syncState();setInterval(syncState,2000);</script></body></html>
