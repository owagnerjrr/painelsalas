<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Salas</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#0d2e50;font-family:Segoe UI,Arial,sans-serif}header{height:134px;background:#07345d;color:#fff;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:20px 32px}h1{font-size:40px;margin:0}header p{margin:5px 0;opacity:.75;font-size:20px}.legend{text-align:center}.clock{text-align:right}.clock b{font-size:48px;display:block}.grid{padding:15px 18px;display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.room{background:white;border:1px solid #d8e2eb;border-radius:13px;padding:13px;min-height:310px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:5px;border-bottom:1px solid #e2e8f0;padding-bottom:10px}.name{font-size:24px;font-weight:800}.badge{border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.busy{background:#fde7ea;color:#9c2636}.free{background:#e4f6ec;color:#147b46}.next{background:#fff1c9;color:#86650c}.maint{background:#e9edf2;color:#53606e}.label{font-size:12px;font-weight:800;color:#57708a;margin-top:14px}.big{font-size:23px;font-weight:800;margin-top:5px}.sub{font-size:16px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slots{margin-top:12px}.slot{font-size:13px;background:#e5f4ec;border-radius:7px;padding:8px;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date-nav{background:#fff;padding:14px 18px;border-bottom:1px solid #d8e2eb;display:flex;justify-content:center;align-items:center;gap:10px}.date-nav button,.date-nav input{height:42px;border:0;border-radius:10px;padding:0 16px;font-weight:800;font-size:16px}.date-nav button{background:#e9f1f8;color:#07345d;cursor:pointer}.date-nav .today-btn{background:#07345d;color:#fff}.date-nav input{border:1px solid #cbd5e1;background:#fff}.date-label{font-weight:800;margin-left:20px}.manual-back{position:fixed;inset:0;background:#0d1b2a88;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.manual-modal{max-height:calc(100vh - 40px);overflow:auto;width:min(620px,100%);background:#fff;border-radius:15px;padding:24px;box-shadow:0 20px 60px #0004;color:#172235}.manual-modal h2{margin:0 0 4px;font-size:28px}.manual-sub{color:#6b7789;font-size:13px;margin-bottom:16px}.manual-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.manual-field{margin-bottom:12px}.manual-field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.manual-field input,.manual-field select{width:100%;border:1px solid #dce4ed;border-radius:8px;padding:10px;font-size:14px;background:#fff}.manual-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.manual-btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.manual-btn.primary{background:#123f73;color:#fff}.manual-btn.light{background:#edf3f9;color:#123f73}.room{cursor:pointer}@media(max-width:600px){.manual-grid2{grid-template-columns:1fr}}
</style></head><body><header><div><h1>Painel de Salas</h1><p>Senac Três Corações</p></div><div class="legend">🟢 Livre &nbsp;&nbsp; 🔴 Em uso &nbsp;&nbsp; 🟡 Próxima &nbsp;&nbsp; ⚪ Manutenção</div><div class="clock"><b id="clock"></b><span id="date"></span><div style="font-size:12px;margin-top:6px">● Atualização automática</div></div></header><div class="date-nav"><button id="prevDay">‹ Dia anterior</button><input id="viewDate" type="date"><button id="todayBtn" class="today-btn">Hoje</button><button id="nextDay">Próximo dia ›</button><span class="date-label" id="viewLabel"></span></div><main class="grid" id="agenda"></main><div id="manualBookingRoot"></div><script>
const BR_ZONE='America/Sao_Paulo';function brParts(now=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:BR_ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return {date:v.year+'-'+v.month+'-'+v.day,time:v.hour+':'+v.minute}}function pastStart(date,time){const n=brParts();return date<n.date||(date===n.date&&time<=n.time)}const rooms=['1','2','3 - ENFERMAGEM','4 - AUDITÓRIO','101 - LAB. DE ESTÉTICA','102','201','202 - LAB. DE INFORMÁTICA','203 / MAKER','204 - LAB. DE INFORMÁTICA','205 / INOVAÇÃO','206','207','208'];const OPEN_TIME='08:00',CLOSE_TIME='22:00';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isoToday=()=>brParts().date;function mins(t){const[h,m]=String(t).split(':').map(Number);return h*60+m}function roomName(n){return /^\d+$/.test(n)?'Sala '+n:n}function roomNumberAny(v){const m=String(v||'').match(/\d+/);return m?m[0]:''}let data={},maintenance={},stateVersion=-1,viewDay=isoToday();function syncDatePicker(){const p=$('#viewDate');if(p)p.value=viewDay;const d=new Date(viewDay+'T12:00:00');$('#viewLabel').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}function shiftDay(n){const d=new Date(viewDay+'T12:00:00');d.setDate(d.getDate()+n);viewDay=d.toISOString().slice(0,10);syncDatePicker();renderAgenda()}function bookingsForRoom(r){const wanted=roomNumberAny(r);const arr=[];for(const [k,v] of Object.entries(data||{}))if(Array.isArray(v)&&(k===r||roomNumberAny(k)===wanted))arr.push(...v);return arr}function isNationalHoliday(date){const md=String(date||'').slice(5);return new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25']).has(md)}function isWeekend(date){const d=new Date(date+'T12:00:00');return d.getDay()===0||d.getDay()===6}function isBlockedDate(date){return isWeekend(date)||isNationalHoliday(date)}function renderAgenda(){const day=viewDay,m=mins(brParts().time),isToday=day===isoToday();$('#agenda').innerHTML=rooms.map(r=>{let a=isBlockedDate(day)?[]:bookingsForRoom(r).filter(x=>(x.date||day)===day);a=a.slice().sort((x,y)=>String(x.start).localeCompare(String(y.start)));let cls='free',status='Livre',headline='Livre nesta data',sub='';if(maintenance[r]){cls='maint';status='MANUTENÇÃO';headline='Manutenção'}else if(a.length){if(isToday&&a.some(b=>m>=mins(b.start)&&m<mins(b.end))){cls='busy';status='EM USO'}else{cls='next';status='AGENDADA'}headline=`${a.length} ${a.length===1?'utilização':'utilizações'} nesta data`;sub=a[0]?.course||''}return `<section class="room" data-room="${esc(r)}" onclick="manualOpenBooking(this.dataset.room)" title="Clique para agendar esta sala"><div class="top"><div class="name">${esc(roomName(r))}</div><span class="badge ${cls}">• ${status}</span></div><div class="label">SITUAÇÃO AGORA</div><div class="big">${esc(headline)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}<div class="label">RESTANTE DO DIA</div><div class="slots">${a.length?a.map(b=>`<div class="slot">${esc(b.start)}–${esc(b.end)} &nbsp; ${esc(b.course||'')}</div>`).join(''):'<div class="slot">Livre</div>'}</div></section>`}).join('')}
function manualEsc(s){return esc(s)}function manualHours(){const out=[];for(let h=8;h<=22;h++){const max=h===22?0:55;for(let m=0;m<=max;m+=5)out.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'))}return out}function manualClose(){document.getElementById('manualBookingRoot').innerHTML=''}function manualRefreshTimes(){const d=document.getElementById('mbDate'),s=document.getElementById('mbStart'),e=document.getElementById('mbEnd');if(!d||!s||!e)return;const hours=manualHours(),oldS=s.value,oldE=e.value;const starts=hours.filter(h=>h<CLOSE_TIME&&!pastStart(d.value,h));s.innerHTML=starts.map(h=>`<option ${h===oldS?'selected':''}>${h}</option>`).join('')||'<option value="">Sem horários disponíveis</option>';const ends=hours.filter(h=>h>s.value&&!pastStart(d.value,h));e.innerHTML=ends.map(h=>`<option ${h===oldE?'selected':''}>${h}</option>`).join('')||'<option value="">Sem horários disponíveis</option>'}async function manualOpenBooking(room){if(isBlockedDate(viewDay||isoToday())){alert('Não é possível agendar aos sábados, domingos ou feriados nacionais.');return}let people=[];try{const r=await fetch('/api/state?people='+Date.now(),{cache:'no-store'});if(r.ok){const s=await r.json();people=Array.isArray(s.people)?s.people:[];data=s.data||data;maintenance=s.maintenance||maintenance;stateVersion=s.version??stateVersion}}catch(e){console.warn(e)}const date=viewDay||isoToday();document.getElementById('manualBookingRoot').innerHTML=`<div class="manual-back"><div class="manual-modal"><h2>Nova utilização</h2><div class="manual-sub">${manualEsc(roomName(room))}</div><div class="manual-field"><label>Colaborador / Responsável</label><input id="mbTeacher" list="mbPeople" placeholder="Digite ou selecione seu nome"><datalist id="mbPeople">${people.map(p=>`<option value="${manualEsc(p)}"></option>`).join('')}</datalist></div><div class="manual-grid2"><div class="manual-field"><label>Data inicial</label><input id="mbDate" type="date" value="${manualEsc(date)}" min="${manualEsc(isoToday())}"></div><div class="manual-field"><label>Data fim <span style="font-weight:400;color:#6b7789">(opcional)</span></label><input id="mbEndDate" type="date" min="${manualEsc(date)}"></div></div><div style="font-size:12px;color:#6b7789;margin:-4px 0 12px">Sábados, domingos e feriados nacionais serão ignorados automaticamente.</div><div class="manual-grid2"><div class="manual-field"><label>Início</label><select id="mbStart"></select></div><div class="manual-field"><label>Até</label><select id="mbEnd"></select></div></div><div class="manual-field"><label>Curso / Turma</label><input id="mbCourse" placeholder="Ex.: Técnico em Informática"></div><div class="manual-actions"><button class="manual-btn light" id="mbCancel">Cancelar</button><button class="manual-btn primary" id="mbSave">Salvar utilização</button></div></div></div>`;document.getElementById('mbCancel').onclick=manualClose;document.getElementById('mbDate').onchange=()=>{const i=document.getElementById('mbDate'),f=document.getElementById('mbEndDate');f.min=i.value;if(f.value&&f.value<i.value)f.value=i.value;manualRefreshTimes()};document.getElementById('mbStart').onchange=manualRefreshTimes;document.getElementById('mbSave').onclick=()=>manualSaveBooking(room);manualRefreshTimes()}function manualPeriodDates(first,last){const dates=[],d=new Date(first+'T12:00:00'),stop=new Date(last+'T12:00:00');if(!Number.isFinite(+d)||!Number.isFinite(+stop)||last<first)return dates;while(d<=stop){dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));d.setDate(d.getDate()+1)}return dates}async function manualSaveBooking(room){const teacher=document.getElementById('mbTeacher').value.trim(),startDate=document.getElementById('mbDate').value,endDate=document.getElementById('mbEndDate').value||document.getElementById('mbDate').value,startTime=document.getElementById('mbStart').value,endTime=document.getElementById('mbEnd').value,course=document.getElementById('mbCourse').value.trim();if(!teacher||!startDate||!startTime||!endTime||!course){alert('Preencha colaborador, datas, início, até e curso/turma.');return}if(endDate<startDate){alert('A data fim não pode ser anterior à data inicial.');return}if(startDate===endDate&&isBlockedDate(startDate)){alert('Não é possível agendar aos sábados, domingos ou feriados nacionais.');return}if(pastStart(startDate,startTime)){alert('Escolha um horário que ainda não passou em Brasília.');return}if(endTime<=startTime){alert('O horário final deve ser maior que o horário inicial.');return}const wanted=roomNumberAny(room),roomKey=rooms.find(r=>roomNumberAny(r)===wanted)||room,btn=document.getElementById('mbSave');btn.disabled=true;btn.textContent='Salvando...';try{const gr=await fetch('/api/state?beforeSave='+Date.now(),{cache:'no-store'});if(!gr.ok)throw new Error('HTTP '+gr.status);const current=await gr.json();const newData=JSON.parse(JSON.stringify(current.data||{})),serverMaintenance=current.maintenance&&typeof current.maintenance==='object'?current.maintenance:{},people=Array.isArray(current.people)?[...current.people]:[];let realKey=Object.keys(newData).find(k=>roomNumberAny(k)===wanted)||roomKey;if(!Array.isArray(newData[realKey]))newData[realKey]=[];const dates=manualPeriodDates(startDate,endDate).filter(day=>!isBlockedDate(day));if(!dates.length){alert('O período informado não possui dias úteis disponíveis.');btn.disabled=false;btn.textContent='Salvar utilização';return}const conflicts=dates.filter(day=>newData[realKey].some(x=>(x.date||day)===day&&startTime<x.end&&endTime>x.start));if(conflicts.length){alert('Já existe utilização nesse horário em: '+conflicts.map(x=>x.split('-').reverse().join('/')).join(', ')+'.');btn.disabled=false;btn.textContent='Salvar utilização';return}dates.forEach(day=>newData[realKey].push({teacher,course,start:startTime,end:endTime,date:day}));newData[realKey].sort((x,y)=>String(x.date||'').localeCompare(String(y.date||''))||String(x.start||'').localeCompare(String(y.start||'')));if(!people.some(p=>String(p).toLocaleLowerCase('pt-BR')===teacher.toLocaleLowerCase('pt-BR')))people.push(teacher);const pr=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({data:newData,maintenance:serverMaintenance,people,version:current.version||0})});const out=await pr.json().catch(()=>({}));if(!pr.ok)throw new Error(out.error||('HTTP '+pr.status));data=newData;maintenance=serverMaintenance;stateVersion=out.version??stateVersion;viewDay=startDate;syncDatePicker();renderAgenda();manualClose();localStorage.setItem('senacUpdate',Date.now().toString());fetch('/api/state?afterSave='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(!v)return;data=v.data||data;maintenance=v.maintenance||maintenance;stateVersion=v.version??stateVersion;renderAgenda()}).catch(e=>console.warn('Confirmação em segundo plano:',e))}catch(e){console.error('Falha ao salvar utilização:',e);alert('Não foi possível salvar a utilização.');btn.disabled=false;btn.textContent='Salvar utilização'}}
async function syncState(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();if((s.version??0)!==stateVersion){stateVersion=s.version??0;data=s.data||{};maintenance=s.maintenance||{};renderAgenda()}}catch(e){console.warn('Falha ao sincronizar painel:',e)}}function clock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('pt-BR',{timeZone:BR_ZONE,hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString('pt-BR',{timeZone:BR_ZONE,weekday:'long',day:'2-digit',month:'long',year:'numeric'})}$('#prevDay').onclick=()=>shiftDay(-1);$('#nextDay').onclick=()=>shiftDay(1);$('#todayBtn').onclick=()=>{viewDay=isoToday();syncDatePicker();renderAgenda()};$('#viewDate').onchange=e=>{viewDay=e.target.value||isoToday();syncDatePicker();renderAgenda()};syncDatePicker();clock();setInterval(clock,1000);syncState();setInterval(syncState,2000);renderAgenda();
</script></body></html>
