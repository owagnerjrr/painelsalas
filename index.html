function formatTurmaCode(value){const digits=String(value||'').replace(/\D/g,'').slice(0,11);return digits.slice(0,3)+(digits.length>3?'.'+digits.slice(3,7):'')+(digits.length>7?'.'+digits.slice(7,11):'')}

const BR_ZONE='America/Sao_Paulo';
function brParts(now=new Date()){
 const p=new Intl.DateTimeFormat('en-CA',{timeZone:BR_ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);
 const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
 return {date:v.year+'-'+v.month+'-'+v.day,time:v.hour+':'+v.minute};
}
function pastStart(date,time){const n=brParts();return date<n.date||(date===n.date&&time<=n.time)}
function cleanupExpired(){ /* Preservar histórico de agendamentos. */ }

function voiceDate(s){
 const today=brParts().date;let d=new Date(today+'T12:00:00Z');
 d.setUTCDate(d.getUTCDate()+(/depois de amanha/.test(s)?2:/amanha/.test(s)?1:0));
 const m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
 if(m){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):+today.slice(0,4);d=new Date(Date.UTC(y,+m[2]-1,+m[1],12))}
 return d.toISOString().slice(0,10);
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isoToday=()=>brParts().date;const mins=t=>{let[h,m]=t.split(':').map(Number);return h*60+m};const roomName=r=>/^\d+$/.test(r)?'Sala '+r:r;let data={};let maintenance={};let viewAgendaDay=isoToday();function saveAll(){}function renderAgenda(){cleanupExpired();let n=new Date(),m=mins(brParts().time),day=viewAgendaDay;document.getElementById('clock').textContent=n.toLocaleTimeString('pt-BR',{timeZone:BR_ZONE,hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=n.toLocaleDateString('pt-BR',{timeZone:BR_ZONE,weekday:'long',day:'2-digit',month:'long',year:'numeric'});document.getElementById('viewDateLabel').textContent=day===isoToday()?'Hoje':'Agenda de '+day.split('-').reverse().join('/');document.getElementById('cards').innerHTML=rooms.map(r=>{let a=(data[r]||[]).filter(x=>(x.date||day)===day).sort((x,y)=>x.start.localeCompare(y.start));let future=day>isoToday(),ref=future?mins(OPEN_TIME):m;let cur=a.find(x=>ref>=mins(x.start)&&ref<mins(x.end)),next=a.find(x=>ref<mins(x.start));let cls=maintenance[r]?'maint':future?(a.length?'busy':'free'):cur?'busy':next?'next':'free',lab=maintenance[r]?'MANUTENÇÃO':future?(a.length?'AGENDADA':'LIVRE'):cur?'EM USO':next?'PRÓXIMA':'LIVRE';let outside=m<mins(OPEN_TIME)||m>=mins(CLOSE_TIME);let headline=maintenance[r]?'Em manutenção':future?(a.length?a.length+' agendamento(s)':'Sem agendamentos'):outside?`Funcionamento ${OPEN_TIME}–${CLOSE_TIME}`:cur?`${cur.start}–${cur.end} · EM USO`:next?`Livre agora · até ${next.start}`:`Livre agora · até ${CLOSE_TIME}`;return `<section class="room" tabindex="0" role="button" aria-label="Solicitar ${esc(roomName(r))}" data-room="${esc(r)}"><div class="top"><div class="name">${esc(roomName(r))}</div><span class="badge ${cls}">● ${lab}</span></div><div class="label">${future?"SITUAÇÃO NA DATA":"SITUAÇÃO AGORA"}</div><div class="now">${headline}</div><div class="desc">${cur?esc(cur.course+' · '+cur.teacher):next?esc(next.course+' · '+next.teacher):''}</div><div class="label">${future?"AGENDAMENTOS DO DIA":"RESTANTE DO DIA"}</div>${a.length?a.map(b=>`<div class="slot ${m>=mins(b.start)&&m<mins(b.end)?'occ':''}" data-info="${esc(roomName(r))}|${day}|${b.start}|${b.end}|${esc(b.teacher)}|${esc(b.course)}|${esc(b.turmaCode||"Não informado")}|${esc(b.dateStart||b.date||day)}|${esc(b.dateEnd||b.date||day)}">${b.start}–${b.end} &nbsp; ${esc(b.course)}</div>`).join(''):'<div class="slot">Livre</div>'}</section>`}).join('');bindDetails()}

function openRoomDetails(room){
 const dialog=document.getElementById('roomDetailDialog');
 document.getElementById('roomDetailTitle').textContent='Solicitar '+roomName(room);
 const hours=Array.from({length:15},(_,i)=>String(i+8).padStart(2,'0')+':00');
 const options=hours.map(h=>'<option value="'+h+'">'+h+'</option>').join('');
 document.getElementById('roomDetailContent').innerHTML='<form id="teacherBookingForm"><p class="room-detail-meta">Solicitação de utilização · Horário de Brasília</p><label class="request-label">Colaborador / Responsável<input name="teacher" list="teacherOptions" required placeholder="Digite seu nome" autocomplete="name"></label><datalist id="teacherOptions"></datalist><div class="request-grid"><label class="request-label">Data inicial<input name="first" type="date" required min="'+isoToday()+'" value="'+isoToday()+'"></label><label class="request-label">Data final (opcional)<input name="last" type="date" min="'+isoToday()+'"></label></div><p class="room-detail-meta">O horário será repetido em todos os dias selecionados, incluindo sábados, domingos e feriados quando necessário.</p><div class="request-grid"><label class="request-label">Início<select name="start" required>'+options+'</select></label><label class="request-label">Até<select name="end" required>'+options+'</select></label></div><label class="request-label">Curso / Turma / Motivo<input name="course" required placeholder="Ex.: Técnico em Informática"></label><label class="request-label">Código da turma (obrigatório)<input name="turmaCode" required inputmode="numeric" maxlength="13" pattern="039\\.[0-9]{4}\\.[0-9]{4}" placeholder="039.2026.0001" title="039 + ano com 4 dígitos + código da turma com 4 dígitos"></label><p id="requestFeedback" role="status" aria-live="polite"></p><div class="request-actions"><button type="button" class="request-cancel">Cancelar</button><button type="submit" class="request-save">Solicitar sala</button></div></form>';
 const form=document.getElementById('teacherBookingForm');
 form.elements.turmaCode.addEventListener('input',e=>{e.target.value=formatTurmaCode(e.target.value)});
 form.elements.first.value=viewAgendaDay;form.elements.last.min=viewAgendaDay;form.elements.start.value='08:00';form.elements.end.value='09:00';
 form.elements.first.addEventListener('change',()=>{form.elements.last.min=form.elements.first.value});
 form.querySelector('.request-cancel').addEventListener('click',()=>dialog.close());
 const showTeacherOptions=(names)=>{document.getElementById('teacherOptions').innerHTML=[...new Set([...defaultPeople,...(names||[])])].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(p=>'<option value="'+esc(p)+'"></option>').join('')};showTeacherOptions([]);fetch('/api/state',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(s)showTeacherOptions(s.people)}).catch(()=>{});
 form.addEventListener('submit',e=>{e.preventDefault();submitTeacherBooking(room,form)});
 dialog.showModal();
}
async function submitTeacherBooking(room,form){
 const feedback=document.getElementById('requestFeedback'),button=form.querySelector('.request-save');
 const teacher=form.elements.teacher.value.trim(),course=form.elements.course.value.trim(),turmaCode=formatTurmaCode(form.elements.turmaCode.value.trim()),first=form.elements.first.value,last=form.elements.last.value||first,start=form.elements.start.value,end=form.elements.end.value;
 const fail=t=>{feedback.textContent=t;feedback.style.color='#b42318'};
 if(!teacher||!course||!first)return fail('Preencha todos os campos obrigatórios.');
 if(!/^039\.\d{4}\.\d{4}$/.test(turmaCode))return fail('Código inválido: informe 039.AAAA.0000.');
 if(first<isoToday()||first===isoToday()&&start<=brParts().time)return fail('Escolha um horário futuro, considerando o horário de Brasília.');
 if(last<first)return fail('A data final não pode ser anterior à inicial.');
 if(start<'08:00'||end>'22:00'||start>=end)return fail('Selecione um período válido entre 08:00 e 22:00.');
 const days=[],cursor=new Date(first+'T12:00:00'),finish=new Date(last+'T12:00:00');
 for(;cursor<=finish;cursor.setDate(cursor.getDate()+1))days.push(cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0'));
 if(!days.length)return fail('Selecione um período válido.');
 button.disabled=true;button.textContent='Salvando...';
 try{
  const res=await fetch('/api/state',{cache:'no-store'});if(!res.ok)throw Error('Não foi possível consultar a agenda.');
  const state=await res.json(),current=state.data||{},existing=current[room]||[];
  if(state.maintenance?.[room])return fail('Sala bloqueada para manutenção. Procure a administração.');
  const duplicateLocations=[];
  for(const [otherRoom,bookings] of Object.entries(current)){
   const matches=(bookings||[]).filter(b=>formatTurmaCode(b.turmaCode)===turmaCode&&days.includes(b.date||isoToday())&&start<b.end&&end>b.start);
   if(matches.length)duplicateLocations.push({otherRoom,matches});
  }
  if(duplicateLocations.length){
   const firstMatch=duplicateLocations[0],previous=firstMatch.matches[0];
   if(!confirm('Essa turma já está marcada na sala '+roomName(firstMatch.otherRoom)+', com professor '+(previous.teacher||'não informado')+'. Você quer trocar?'))return;
  }
  const removed=new Map(duplicateLocations.map(x=>[x.otherRoom,new Set(x.matches)]));
  const overlap=existing.find(b=>!removed.get(room)?.has(b)&&days.includes(b.date||isoToday())&&start<b.end&&end>b.start);
  if(overlap)return fail('Conflito: a sala já está ocupada em '+(overlap.date||first).split('-').reverse().join('/')+' nesse horário.');
  for(const [otherRoom,ids] of removed)current[otherRoom]=(current[otherRoom]||[]).filter(b=>!ids.has(b));
  const groupId=days.length>1?'docente-'+Date.now()+'-'+Math.random().toString(36).slice(2):null;
  current[room]=(current[room]||[]).concat(days.map(date=>({...{teacher,course,turmaCode,start,end,date},...(groupId?{groupId,dateStart:first,dateEnd:last}:{})})));
  const people=[...new Set([...(state.people||[]),teacher])];
  const save=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:current,maintenance:state.maintenance||{},people,version:state.version??0})});
  if(!save.ok){const detail=await save.json().catch(()=>({}));throw Error(detail.error||'Não foi possível salvar. Tente novamente.')}
  data=current;renderAgenda();document.getElementById('roomDetailDialog').close();alert(days.length>1?'Solicitação registrada para '+days.length+' dias.':'Solicitação registrada com sucesso.');
 }catch(err){fail(err.message||'Erro ao salvar solicitação.')}
 finally{button.disabled=false;button.textContent='Solicitar sala'}
}

roomDialog.querySelector('.room-detail-close').addEventListener('click',()=>roomDialog.close());
roomDialog.addEventListener('click',e=>{if(e.target===roomDialog)roomDialog.close()});
document.getElementById('cards').addEventListener('click',e=>{const card=e.target.closest('.room[data-room]');if(card)openRoomDetails(card.dataset.room)});

function bindDetails(){const d=document.getElementById('detail');document.querySelectorAll('.slot[data-info]').forEach(el=>{el.onmouseenter=e=>{let [r,dt,s,en,t,c,code,dateStart,dateEnd]=el.dataset.info.split('|');const ptDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'):dt.split('-').reverse().join('/');const period=dateStart&&dateEnd&&dateStart!==dateEnd?`<br>📆 Período reservado: ${ptDate(dateStart)} até ${ptDate(dateEnd)}`:`<br>📆 Reservado para: ${ptDate(dateEnd||dt)}`;d.innerHTML=`<b>${r}</b><br>📅 Data consultada: ${ptDate(dt)}<br>🕐 ${s} às ${en}<br>👤 ${t}<br>🎓 ${c}<br>🔢 Turma: ${code||"Não informado"}${period}`;d.style.display='block'};el.onmousemove=e=>{const pad=12,offset=18;const w=d.offsetWidth,h=d.offsetHeight;let x=e.clientX+offset,y=e.clientY+offset;if(x+w>innerWidth-pad)x=e.clientX-w-offset;if(y+h>innerHeight-pad)y=e.clientY-h-offset;d.style.left=Math.max(pad,Math.min(x,innerWidth-w-pad))+'px';d.style.top=Math.max(pad,Math.min(y,innerHeight-h-pad))+'px'};el.onmouseleave=()=>d.style.display='none'})}document.getElementById('viewAgendaDate').value=viewAgendaDay;document.getElementById('viewAgendaDate').min=isoToday();document.getElementById('viewAgendaDate').onchange=e=>{if(e.target.value){viewAgendaDay=e.target.value;renderAgenda()}};document.getElementById('viewToday').onclick=()=>{viewAgendaDay=isoToday();document.getElementById('viewAgendaDate').value=viewAgendaDay;renderAgenda()};renderAgenda();setInterval(renderAgenda,1000);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[,.;]/g,' ').replace(/\s+/g,' ').trim();const nums={uma:1,um:1,duas:2,dois:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20};function parseDate(s){return voiceDate(s)}function times(s){s=s.replace(/dar uma/g,'da uma');let a=[...s.matchAll(/\b(\d{1,2})(?::(\d{2}))?\b/g)].map(m=>({h:+m[1],m:+(m[2]||0),i:m.index})).filter(x=>x.h<=23&&x.m<60);if(a.length>=2)return a.slice(0,2).map((x,i)=>{let h=x.h,q=s.slice(Math.max(0,x.i-15),x.i+25);if(h<12&&/tarde|noite/.test(q))h+=12;else if(i===0&&h<=7&&a[1].h>h)h+=12;else if(i===1&&h<=7&&a[0].h>=8)h+=12;return `${String(h).padStart(2,'0')}:${String(x.m).padStart(2,'0')}`});let w=[...s.matchAll(/\b(uma|um|duas|dois|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte)\b/g)];if(w.length>=2)return w.slice(0,2).map((x,i)=>{let h=nums[x[1]];if(h<12&&(i===0&&nums[w[1][1]]>h||/tarde|noite/.test(s.slice(x.index,x.index+30))))h+=12;if(i===1&&h<12&&nums[w[0][1]]>=8)h+=12;return String(h).padStart(2,'0')+':00'});return []}function roomOf(s){for(const r of rooms){let n=r.match(/^\d+/)[0];if(new RegExp('(?:sala|lab|na|no)?\\s*'+n+'\\b').test(s))return r}return null}function personOf(s){for(const p of defaultPeople){if(norm(p).split(' ').filter(x=>x.length>2).some(x=>new RegExp('\\b'+x+'\\b').test(s)))return p}return null}function courseOf(s,p){let x=s.replace(/\b(agendar|agenda|marcar|marca|reservar|reserva|bota|coloca|hoje|amanha|sala|nome|professor|prof|curso|turma|das|da|de|ate|as|na|no|pra|pro)\b/g,' ').replace(/\b\d{1,4}(?::\d{2})?\b/g,' ');if(p)norm(p).split(' ').forEach(w=>{if(w.length>2)x=x.replace(new RegExp('\\b'+w+'\\b','g'),' ')});x=x.replace(/\b(uma|um|duas|dois|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|tarde|noite|manha|horas?)\b/g,' ').replace(/\s+/g,' ').trim();return x?x.replace(/\binfo\b/,'Informática'):null}function voiceShow(msg,t=''){document.getElementById('voiceRoot').innerHTML=`<div class="voice-back"><div class="voice-box"><div class="voice-icon">🎙️</div><h2>Agendar por voz</h2><p>${msg}</p>${t?`<div class="voice-transcript"><b>Você disse:</b> “${esc(t)}”</div>`:''}<button class="voice-cancel">Fechar</button></div></div>`;document.querySelector('.voice-cancel').onclick=()=>voiceRoot.innerHTML=''}function handleVoice(t){voiceShow('Agendamentos são feitos somente pela Administração.',t)}
